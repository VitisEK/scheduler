name: HACS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom HACS integration
        uses: hacs/action@main
        with:
          category: integration
          # Custom-repository installation only. Public catalog requirements
          # (Brands registration and an OSI license) are outside this scope.
          # Do not select a project license merely to satisfy a catalog check.
          ignore: brands license
          comment: false
